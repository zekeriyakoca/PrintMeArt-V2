<section class="related-section mb-20" #triggerRef>
  @if (isLoading()) {
  <div class="loading-state">
    <div class="loading-bar"></div>
  </div>
  }

  @if (products().length > 0) {
  <div class="section-header">
    <span class="section-tag">{{ 'related.curated' | t }}</span>
    <h2 class="section-title">{{ 'related.title' | t }}</h2>
  </div>
  <div class="products-grid md:gap-[1.5rem]">
    @for (product of products(); track product.id; let i = $index) {
    <div class=" product-wrapper" [style.animation-delay]="i * 80 + 'ms'">
      <app-product-card [product]="product"></app-product-card>
    </div>
    }
  </div>
  }
  <!-- Rendered on the server as well, so the product page always links to its category's page -->
  @if (categoryName()) {
  <p class="mt-8 text-center">
    <a class="text-sm font-medium text-[#384f8c] hover:text-[#2c3e70] underline underline-offset-4" [routerLink]="categoryName() | listing">
      {{ 'related.seeCategory' | t: { name: ('name.' + categoryName() | t) } }}
    </a>
  </p>
  }
</section>
