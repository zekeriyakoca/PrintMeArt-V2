<div class="image-container">
  @if (images() && images().length > 0) {
  <div class=" grid grid-cols-2 md:grid-cols-3 gap-3 lg:gap-6">
    <!-- Main large image -->
    <div class="md:h-full col-span-2 md:col-span-1 row-span-2 relative rounded-md sm:rounded-xl cursor-pointer"
      (click)="openGallery()">
      <img [src]="images()[0].large" [alt]="alt()"
        class="object-cover rounded-md sm:rounded-xl w-full h-full aspect-[3/4] md:aspect-auto">
      <div
        class="absolute inset-0 bg-neutral-900/20 opacity-0 hover:opacity-40 transition-opacity rounded-md sm:rounded-xl">
      </div>
    </div>

    <!-- Other images -->
    @for (item of images().slice(1, 4); track $index; let i = $index) {
    <div class="relative rounded-md sm:rounded-xl overflow-hidden z-0 cursor-pointer"
      [class]="i === 0 ? 'col-span-1 row-span-2' : ''" (click)="openGallery(i + 1)">
      <img [src]="item.large" [alt]="alt()" class="object-cover w-full h-full rounded-md sm:rounded-xl"
        [class]="i === 0 ? '' : 'aspect-[6/5] lg:aspect-[6/4]'">
      <div class="absolute inset-0 bg-slate-900/20 opacity-0 hover:opacity-60 transition-opacity"></div>
      @if (item.isDetail) { <ng-container [ngTemplateOutlet]="detailBadge" /> }
    </div>
    }
  </div>

  <!-- Show all photos button -->
  <div
    class="absolute hidden md:flex items-center gap-2 left-3 bottom-3 px-4 py-2 rounded-lg bg-[#384f8cd9] text-white shadow-sm cursor-pointer hover:bg-[#2f4378] transition-colors z-10"
    (click)="openGallery()">
    <app-icon iconName="grid" class="h-4 w-4 text-white" />
    <span class="text-white text-sm font-medium">{{ 'gallery.showAll' | t }}</span>
  </div>

  <!-- Gallery Component -->
  <app-image-gallery-modal [isShowModal]="showGallery" [images]="galleryImages()" (onClose)="closeGallery()"
    [startIndex]="galleryStartIndex()">
  </app-image-gallery-modal>
  }
</div>
<ng-template #detailBadge>
  <div class="absolute left-2 bottom-2 sm:left-3 sm:bottom-3 flex items-center gap-2 rounded-lg bg-white/90 backdrop-blur px-2.5 py-1.5 sm:px-3 sm:py-2 shadow-md pointer-events-none">
    <app-icon iconName="search" class="h-4 w-4 text-[#384f8c]" />
    <div class="leading-tight">
      <div class="text-xs sm:text-sm font-semibold text-gray-900">{{ 'gallery.detailTitle' | t }}</div>
      <div class="hidden sm:block text-[11px] text-gray-600">{{ 'gallery.detailSubtitle' | t }}</div>
    </div>
  </div>
</ng-template>
