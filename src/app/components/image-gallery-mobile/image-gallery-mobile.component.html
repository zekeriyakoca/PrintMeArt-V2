<div class="gallery-mobile relative -mx-4">
  <div #track class="track flex overflow-x-auto snap-x snap-mandatory" (scroll)="onScroll()">
    @for (item of images(); track $index; let i = $index) {
      <div
        class="relative w-full shrink-0 snap-center snap-always overflow-hidden bg-gradient-to-br from-gray-50 via-gray-100 to-gray-50"
        [class]="landscape() ? 'aspect-[4/3]' : 'aspect-[4/5]'"
        (click)="open.emit(i)"
      >
        @if (i === 0) {
          <div class="closeup closeup--touch absolute inset-0 flex items-center justify-center" [appCloseupCycle]="crops()">
            <img
              [src]="item.large"
              [alt]="alt()"
              class="max-w-[86%] max-h-[84%] object-contain shadow-[0_18px_40px_-16px_rgba(15,23,42,0.45)]"
              fetchpriority="high"
            />
            @if (crops().length) {
              <div class="closeup__media">
                <img class="closeup__img" [src]="crops()[0]" [alt]="alt()" decoding="async" />
              </div>
              <span class="closeup__ring"></span>
              <button type="button" class="loupe-hint" [attr.aria-label]="'gallery.seeCloseups' | t" (click)="showCloseups($event)">
                <span class="loupe-hint__label">
                  <app-icon iconName="search" class="h-3.5 w-3.5 text-[#384f8c]" />
                  {{ 'gallery.detailTitle' | t }}
                </span>
              </button>
            }
          </div>
        } @else {
          <img [src]="item.large" [alt]="alt()" class="h-full w-full object-cover" loading="lazy" decoding="async" />
          @if (item.isDetail) {
            <div class="absolute left-3 top-3 flex items-center gap-1.5 rounded-full bg-white/90 px-3 py-1.5 shadow-sm backdrop-blur pointer-events-none">
              <app-icon iconName="search" class="h-3.5 w-3.5 text-[#384f8c]" />
              <span class="text-xs font-semibold text-gray-900">{{ 'gallery.detailTitle' | t }}</span>
            </div>
          }
        }
      </div>
    }
  </div>

  <!-- Counter, opens the full-screen gallery -->
  @if (images().length > 1) {
    <button
      type="button"
      class="counter absolute top-3 flex h-9 items-center gap-1.5 rounded-full bg-white/90 pl-3 pr-3.5 text-xs font-semibold tabular-nums text-gray-900 shadow-sm ring-1 ring-black/5 backdrop-blur"
      [attr.aria-label]="'gallery.showAll' | t"
      (click)="open.emit(current())"
    >
      <app-icon iconName="grid" class="h-3.5 w-3.5 text-[#384f8c]" />
      {{ current() + 1 }} / {{ images().length }}
    </button>
  }
</div>

<!-- Dots -->
@if (images().length > 1) {
  <div class="mt-3 flex justify-center gap-0.5">
    @for (item of images(); track $index; let i = $index) {
      <button type="button" class="dot flex h-6 items-center justify-center px-1" [attr.aria-label]="i + 1 + ' / ' + images().length" (click)="goTo(i)">
        <span
          class="block h-1.5 rounded-full transition-all duration-300"
          [class]="i === current() ? 'w-5 bg-[#384f8c]' : 'w-1.5 bg-gray-300'"
        ></span>
      </button>
    }
  </div>
}
