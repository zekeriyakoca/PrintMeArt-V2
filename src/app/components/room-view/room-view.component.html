<div class="room-view" (click)="close.emit()">
  <div class="room-view-body" (click)="$event.stopPropagation()">
    <div class="stage">
      <canvas #stage class="stage-canvas"></canvas>
      @if (printSize(); as size) {
      <span class="scale-note">{{ 'room.toScale' | t: { width: size.width, height: size.height } }}</span>
      }
    </div>

    <aside class="panel">
      <div class="panel-header">
        <p class="eyebrow">{{ 'room.eyebrow' | t }}</p>
        <button type="button" class="close-btn" [aria-label]="'room.close' | t" (click)="close.emit()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <h2 class="title">{{ title() }}</h2>

      @if (rooms.length > 1) {
        <section>
          <h3 class="label">{{ 'room.room' | t }}</h3>
          <div class="rooms">
            @for (scene of rooms; track scene.id) {
            <button type="button" class="room-thumb" [class.active]="scene.id === room().id" (click)="room.set(scene)" [title]="scene.name">
              <img [src]="scene.image" [alt]="scene.name" crossorigin="anonymous" />
            </button>
            }
          </div>
        </section>
      }

      <p class="footnote">{{ 'room.footnote' | t }}</p>
    </aside>
  </div>
</div>
