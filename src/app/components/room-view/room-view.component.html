<div class="stage">
  <canvas #stage class="stage-canvas" [class.pending]="!ready()"></canvas>
  @if (!ready()) {
    <app-preparing-state class="preparing" />
  }
  @if (ready() && printSize(); as size) {
    <span class="scale-note">{{ 'room.toScale' | t: { width: size.width, height: size.height } }}</span>
  }
</div>

@if (rooms.length > 1) {
  <div class="rooms" role="group" [attr.aria-label]="'room.room' | t">
    @for (scene of rooms; track scene.id) {
      <button type="button" class="room-thumb" [class.active]="scene.id === room().id" [attr.aria-pressed]="scene.id === room().id" (click)="room.set(scene)" [title]="scene.name">
        <img [src]="scene.thumb" [alt]="scene.name" loading="lazy" decoding="async" />
      </button>
    }
  </div>
}
