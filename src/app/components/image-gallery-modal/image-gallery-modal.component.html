@if (isShowModal() && images().length > 0) {
<div class="fixed inset-0 z-50">
  <div class="absolute inset-0 bg-[#0f172a]/90 backdrop-blur-sm" (click)="closeModal()">

    <div class="relative z-10 flex h-full flex-col" (keydown)="onSelectedImageKeyDown($event)" tabindex="0">

      <!-- Counter -->
      <div class="safe-top absolute left-4 md:left-6 flex h-11 items-center text-sm font-medium tabular-nums text-white/80 z-10">
        {{ currentIndex() + 1 }} / {{ images().length }}
        @if (images()[currentIndex()].isDetail) {
          <span class="closeup-tag closeup-tag--dark ml-3">{{ 'gallery.detailTitle' | t }}</span>
        }
      </div>

      <!-- Close button -->
      <button [attr.aria-label]="'a11y.close' | t" class="safe-top absolute right-2 md:right-4 flex h-11 w-11 items-center justify-center text-white hover:text-gray-300 z-10"
        (click)="closeModal(); $event.stopPropagation()">
        <app-icon iconName="close" class="w-8 h-8"></app-icon>
      </button>

      <!-- Previous button -->
      <button [attr.aria-label]="'a11y.previous' | t" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white hidden md:block hover:text-gray-300 z-10"
        (click)="prevSelectedImage(); $event.stopPropagation()" [disabled]="images().length <= 1">
        <app-icon iconName="chevron-left" class="w-10 h-10"></app-icon>
      </button>

      <!-- Next button -->
      <button [attr.aria-label]="'a11y.next' | t" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white hidden md:block hover:text-gray-300 z-10"
        (click)="nextSelectedImage(); $event.stopPropagation()" [disabled]="images().length <= 1">
        <app-icon iconName="chevron-right" class="w-10 h-10"></app-icon>
      </button>

      <!-- Main image -->
      <div class="flex-1 flex items-center justify-center p-4 pt-16 md:pt-4 pb-0 overflow-hidden"
        [style.touch-action]="isZoomed() ? 'none' : 'pan-y pinch-zoom'"
        (mousemove)="onZoomMouseMove($event)" (touchstart)="onTouchStart($event)" (touchmove)="onTouchMove($event)"
        (touchend)="onTouchEnd($event)">
        <img [src]="images()[currentIndex()].url" [alt]="'Image ' + (currentIndex() + 1)"
          class="max-w-[94vw] max-h-[78vh] object-contain transition-transform duration-150 ease-out"
          [class.cursor-zoom-in]="!isZoomed()" [class.cursor-zoom-out]="isZoomed()" [style.transform]="zoomTransform()"
          (click)="toggleZoom($event)">
      </div>

      <!-- Thumbnail navigation -->
      <div class="safe-bottom p-4">
        <div #thumbs class="thumbs overflow-x-auto">
          <div class="flex gap-2 w-max mx-auto">
          @for (image of images(); track image.id; let i = $index) {
          <button [attr.data-thumb]="i"
            class="flex-shrink-0 w-14 h-14 sm:w-16 sm:h-16 md:w-20 md:h-20 rounded-lg overflow-hidden border-2 transition-all duration-200 hover:opacity-100"
            [class.border-white]="i === currentIndex()" [class.border-transparent]="i !== currentIndex()"
            [class.opacity-50]="i !== currentIndex()" [class.opacity-100]="i === currentIndex()"
            (click)="selectImage(i); $event.stopPropagation()">
            <img [src]="image.url" [alt]="'Thumbnail ' + (i + 1)" class="w-full h-full object-cover">
          </button>
          }
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
}
