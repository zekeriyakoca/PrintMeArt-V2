<section class="relative">
  <div class="flex items-center justify-between gap-8 mb-8 md:mb-10">
    <div>
      <p class="text-xs font-semibold tracking-widest text-slate-400 uppercase mb-3">Public-domain masterpieces</p>
      <h2 class="text-2xl md:text-3xl lg:text-4xl font-bold text-slate-900 leading-tight!">
        From the world's great museums,<br class="hidden sm:block" />
        printed by hand in <span class="script">Den Bosch</span>
      </h2>
    </div>

    <a routerLink="/about" class="seal hidden sm:block shrink-0" aria-label="Meet our family studio in Den Bosch">
      <svg viewBox="0 0 120 120" class="w-28 h-28 lg:w-32 lg:h-32">
        <defs>
          <path id="seal-ring" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0" />
        </defs>
        <circle cx="60" cy="60" r="58" class="seal-disc" />
        <g class="seal-text">
          <text>
            <textPath href="#seal-ring" textLength="285" lengthAdjust="spacing">PRINTED BY HAND · DEN BOSCH · NETHERLANDS ·</textPath>
          </text>
        </g>
        <!-- A small framed print at the centre -->
        <rect x="47" y="45" width="26" height="30" rx="1.5" class="seal-frame" />
        <rect x="52" y="50" width="16" height="20" class="seal-art" />
      </svg>
    </a>
  </div>

  <div class="marquee" role="list">
    <div class="marquee-track">
      @for (copy of [0, 1]; track copy) {
        @for (museum of museums; track museum.name) {
          <a role="listitem" [attr.aria-hidden]="copy === 1 || null" [tabindex]="copy === 1 ? -1 : 0"
            routerLink="/products" [queryParams]="{ attributeName: museum.attributeName }" class="museum">
            {{ museum.name }}
          </a>
          <span class="divider" aria-hidden="true">✦</span>
        }
      }
    </div>
  </div>
</section>
