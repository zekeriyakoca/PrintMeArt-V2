<section class="margin-header bg-[#faf6ff]">
  <div class="mx-auto flex min-h-[calc(100vh-80px)] max-w-2xl flex-col items-center justify-center px-4 py-16 text-center sm:py-24">
    <!-- Empty frame on a nail -->
    <svg class="w-48 sm:w-60" viewBox="0 0 240 210" role="img" aria-label="An empty picture frame hanging on a nail">
      <g class="frame-swing">
        <path d="M120 16 L60 64 M120 16 L180 64" stroke="#94a3b8" stroke-width="1.5" fill="none" />
        <rect x="50" y="68" width="152" height="136" rx="4" fill="#0f172a" opacity="0.08" />
        <rect x="44" y="60" width="152" height="136" rx="4" fill="#0f172a" />
        <rect x="54" y="70" width="132" height="116" fill="#fff" />
        <rect x="72" y="88" width="96" height="80" fill="#faf6ff" stroke="#db2877" stroke-opacity="0.4"
          stroke-width="1.5" stroke-dasharray="5 5" />
        <text x="120" y="138" text-anchor="middle" font-family="Poppins, sans-serif" font-size="28" font-weight="600"
          fill="#db2877">404</text>
      </g>
      <circle cx="120" cy="16" r="4" fill="#0f172a" />
    </svg>

    <span class="mt-8 block text-2xl sm:text-3xl"
      style="color: #db2877; font-family: 'Dancing Script', cursive; font-weight: 600">{{ 'notFound.eyebrow' | t }}</span>
    <h1 class="mt-3 text-[1.85rem] font-semibold !leading-[115%] text-slate-900 sm:text-[2.15rem]">
      {{ 'notFound.title' | t }}
    </h1>
    <p class="mt-4 max-w-md text-slate-600">
      {{ 'notFound.text' | t }}
    </p>

    <div class="mt-8 flex w-full flex-col gap-3 sm:w-auto sm:flex-row">
      <a routerLink="/"
        class="inline-flex w-full items-center justify-center rounded-full bg-slate-900 px-5 py-3 text-sm font-medium text-slate-50 shadow-xl hover:bg-slate-800 sm:w-auto sm:px-6 sm:text-base">
        {{ 'notFound.home' | t }}
      </a>
      <a routerLink="/products"
        class="inline-flex w-full items-center justify-center rounded-full border border-slate-200 bg-white px-5 py-3 text-sm font-medium text-slate-900 hover:bg-slate-50 sm:w-auto sm:px-6 sm:text-base">
        <span>{{ 'visit.browse' | t }}</span>
        <app-icon iconName="arrow-right" class="ms-2.5 h-5 w-5"></app-icon>
      </a>
    </div>
  </div>
</section>
