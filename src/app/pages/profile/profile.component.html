<div class="margin-header min-h-screen bg-slate-50">
  <div class="mx-auto max-w-3xl px-4 py-12 sm:px-6 sm:py-20">
    <!-- Profile Card -->
    <div class="overflow-hidden rounded-3xl bg-white shadow-xl shadow-slate-200/50">
      <!-- Header -->
      <div class="relative bg-slate-900 px-8 py-10">
        <div class="absolute inset-0 overflow-hidden">
          <div class="absolute -right-20 -top-20 h-64 w-64 rounded-full bg-white/5"></div>
          <div class="absolute -bottom-32 -left-20 h-80 w-80 rounded-full bg-white/5"></div>
        </div>
        <div class="relative flex items-center gap-5">
          @if (user()?.profilePictureUrl) {
          <img [src]="user()!.profilePictureUrl!" [alt]="user()!.name"
            class="h-20 w-20 rounded-2xl object-cover ring-4 ring-white/20" referrerpolicy="no-referrer" />
          } @else {
          <div class="flex h-20 w-20 items-center justify-center rounded-2xl bg-white/10 text-3xl font-bold text-white">
            {{ user()?.name?.charAt(0) || 'U' }}
          </div>
          }
          <div>
            <h1 class="text-2xl font-bold text-white">{{ user()?.name || 'Your Account' }}</h1>
            <p class="mt-1 text-sm text-slate-300">{{ user()?.email }}</p>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="space-y-8 p-8">
        <div>
          <h2 class="text-lg font-semibold text-slate-900">Personal Information</h2>
          <p class="text-sm text-slate-500">Your account details</p>
        </div>

        <div class="divide-y divide-slate-100 rounded-2xl border border-slate-200">
          <div class="flex items-center justify-between px-5 py-4">
            <span class="text-sm text-slate-500">Full name</span>
            <span class="text-sm font-medium text-slate-900">{{ user()?.name || '—' }}</span>
          </div>
          <div class="flex items-center justify-between px-5 py-4">
            <span class="text-sm text-slate-500">Email</span>
            <span class="text-sm font-medium text-slate-900">{{ user()?.email || '—' }}</span>
          </div>
        </div>

        <a routerLink="/orders"
          class="flex items-center gap-4 rounded-2xl border border-slate-200 p-5 hover:bg-slate-50">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-100">
            <app-icon iconName="shopping-bag" class="h-5 w-5 text-slate-600" />
          </div>
          <div class="flex-1">
            <p class="font-medium text-slate-900">My orders</p>
            <p class="text-sm text-slate-500">Track and review your orders</p>
          </div>
          <app-icon iconName="chevron-right" class="h-5 w-5 text-slate-400" />
        </a>
      </div>
    </div>
  </div>
</div>
