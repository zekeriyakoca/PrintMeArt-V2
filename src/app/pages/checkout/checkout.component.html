<div class="checkout-page px-0 sm:px-2">
  <div class="checkout-container px-0">
    <!-- Header -->
    <div class="checkout-header">
      <div class="header-content">
        <h1 class="checkout-title">{{ 'cart.checkout' | t }}</h1>
        <div class="checkout-steps">
          <span class="step completed">
            <app-icon iconName="check" class="w-4 h-4"></app-icon>
            {{ 'header.cart' | t }}
          </span>
          <span class="step-divider"></span>
          <span class="step active">{{ 'checkout.shipping' | t }}</span>
          <span class="step-divider"></span>
          <span class="step">{{ 'checkout.payment' | t }}</span>
        </div>
      </div>
      <a routerLink="/" class="back-link mt-1 md:mt-0">
        <app-icon iconName="arrow-left" class="w-[18px] h-[18px]"></app-icon>
        {{ 'checkout.backToShop' | t }}
      </a>
    </div>

    <!-- Main Content -->
    <div class="checkout-content">
      <!-- Form Section -->
      <div class="form-section">
        @if (showGoogleFill()) {
        <button type="button" class="google-fill" (click)="signInWithGoogle()">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          <span class="google-fill-text">
            <span class="google-fill-title">{{ 'checkout.googleFill' | t }}</span>
            <span class="google-fill-hint">{{ 'checkout.googleFillHint' | t }}</span>
          </span>
          <app-icon iconName="arrow-right" class="w-4 h-4 shrink-0 text-slate-400"></app-icon>
        </button>
        }
        <div class="section-card">
          <div class="section-header">
            <div class="section-icon">
              <app-icon iconName="user-profile" class="w-[22px] h-[22px]"></app-icon>
            </div>
            <div>
              <h2 class="section-title">{{ 'checkout.contact' | t }}</h2>
              <p class="section-subtitle">{{ 'checkout.contactHint' | t }}</p>
            </div>
          </div>
          <app-checkout-user-info [(userDetails)]="userDetails" [(isFormValid)]="isFormValid" [(serverErrors)]="serverErrors" (contactEntered)="saveContact()" />
        </div>
      </div>

      <!-- Summary Sidebar -->
      <div class="summary-section">
        <div class="summary-sticky">
          <app-order-summary [cartItems]="cartItems()" [country]="userDetails.country">
            <order-button>
              <button class="confirm-btn" (click)="confirmOrder()" [disabled]="!isFormValid() || isProcessing()">
                @if (isProcessing()) {
                <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                  </path>
                </svg>
                Processing...
                } @else {
                <app-icon iconName="credit-card" class="w-5 h-5"></app-icon>
                {{ 'checkout.proceed' | t }}
                <app-icon iconName="arrow-right" class="w-4 h-4"></app-icon>
                }
              </button>
            </order-button>
          </app-order-summary>
        </div>
      </div>
    </div>
  </div>
</div>
